<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REXO</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #0a0a0a; color: #fff; padding: 15px; margin: 0; }
        #chat { height: 70vh; overflow-y: auto; border: 1px solid #333; padding: 12px; margin-bottom: 10px; background: #141414; border-radius: 14px; }
  .user { color: #4da6ff; margin: 10px 0; text-align: right; padding: 8px 12px; background: #1e2a3a; border-radius: 10px; }
  .bot { color: #00ff88; margin: 10px 0; text-align: right; padding: 8px 12px; background: #1a2a1a; border-radius: 10px; }
  .error { color: #ff6b6b; margin: 10px 0; background: #3a1a1a; padding: 10px; border-radius: 8px; text-align: right; font-size: 14px; }
  .input-area { display: flex; gap: 8px; position: sticky; bottom: 0; background: #0a0a0a; padding: 10px 0; }
        input { flex: 1; padding: 12px; background: #1a1a1a; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: #00ff88; }
        button { padding: 12px 18px; background: #00ff88; border: none; color: #000; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: #00cc6a; }
        button.clear { background: #ff4444; color: #fff; }
        button.clear:hover { background: #cc3333; }
        h2 { text-align: center; margin: 10px 0 20px 0; color: #00ff88; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .loading { display: inline-block; width: 18px; height: 18px; border: 3px solid #00ff88; border-top: 3px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        pre { background: #0d0d0d; padding: 10px; border-radius: 6px; overflow-x: auto; text-align: left; direction: ltr; }
    </style>
</head>
<body>
    <h2>REXO</h2>
    <div class="top-bar">
        <button class="clear" onclick="clearChat()">مسح المحادثة</button>
        <span style="color: #666; font-size: 12px;">REXO v2.4</span>
    </div>
    <div id="chat"></div>
    <div class="input-area">
        <button onclick="sendMessage()">ارسال</button>
        <input id="userInput" placeholder="اكتب رسالتك هنا..." autocomplete="off">
    </div>

<script>
const API_KEYS = [
    "AIzaSyBQ0BxLxPi4tuuFo91bf3owHz-qmiBJ3xQ",
    "AIzaSyDnofLa5mz5in_pKK5StEZn-PUCXr1RFiw",
    "AIzaSyBMnI2Vw6FK1XKcEVQ8ZPTn-7X2rIaTPLs",
    "AIzaSyCSgawoy6EnEubynlekKor2zTgl5LRfDyU",
    "AIzaSyDvrbb8S1zf9pIcSICPpj3VLhbvmthNnFc"
];

let currentKeyIndex = 0;
const chatDiv = document.getElementById('chat');
const userInput = document.getElementById('userInput');

const SYSTEM_INSTRUCTION = `انت اسمك REXO. انت مساعد ذكي.
المطور بتاعك هو سيف هاني أبو دراج منيا القمح محافظة الشرقية.
لما حد يسألك مين عملك او مين المطور بتاعك، قول: "المطور بتاعي سيف هاني أبو دراج منيا القمح محافظة الشرقية".
لما ترد على سيف، لازم تناديه "يا سيف" في أول الرد وخليك ودود ومحترم. دايماً افتكر ان سيف هو اللي برمجك.
ردودك تكون مختصرة ومفيدة ومباشرة. اتكلم مصري.`;

function loadChat() {
    const saved = localStorage.getItem('rexo_chat');
    if (saved) chatDiv.innerHTML = saved;
    else addMessage('REXO: أهلا يا سيف! أنا REXO، المساعد اللي انت برمجته. أؤمرني يا أبو دراج 💚', 'bot');
}

function saveChat() {
    localStorage.setItem('rexo_chat', chatDiv.innerHTML);
}

function addMessage(text, className) {
    const div = document.createElement('div');
    div.className = className;
    text = text.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
    div.innerHTML = text;
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
    saveChat();
}

function clearChat() {
    if (confirm('متأكد يا سيف عايز تمسح المحادثة؟')) {
        localStorage.removeItem('rexo_chat');
        chatDiv.innerHTML = '';
        addMessage('REXO: مسحتلك الشات يا أبو دراج. نبدأ من جديد 💚', 'bot');
    }
}

function getDateTime() {
    const optionsDate = { timeZone: 'Africa/Cairo', year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
    const optionsTime = { timeZone: 'Africa/Cairo', hour: '2-digit', minute: '2-digit', hour12: true };
    const now = new Date();

    const miladi = now.toLocaleDateString('ar-EG', optionsDate);
    const hijri = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', optionsDate).format(now);
    const time = now.toLocaleTimeString('ar-EG', optionsTime);

    return `يا سيف النهاردة ${miladi}، الموافق ${hijri} هجري. والساعة دلوقتي ${time} بتوقيت مصر 🇪🇬`;
}

async function tryRequest(apiKey, text) {
    if (text.includes('التاريخ') || text.includes('كام في الشهر') || text.includes('انهاردة كام') || text.includes('الساعة') || text.includes('الوقت')) {
        return { ok: true, fake: true, reply: getDateTime() };
    }
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            system_instruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
            contents: [{ parts: [{ text: text }] }]
        })
    });
    return response;
}

async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;
    addMessage(`انت: ${text}`, 'user');
    userInput.value = '';
    const thinkingDiv = document.createElement('div');
    thinkingDiv.className = 'bot';
    thinkingDiv.innerHTML = 'REXO: <span class="loading"></span> بفكر يا سيف...';
    chatDiv.appendChild(thinkingDiv);
    chatDiv.scrollTop = chatDiv.scrollHeight;
    let lastError = null;
    for (let i = 0; i < API_KEYS.length; i++) {
        const keyIndex = (currentKeyIndex + i) % API_KEYS.length;
        const apiKey = API_KEYS[keyIndex];
        try {
            const response = await tryRequest(apiKey, text);
            if (response.fake) {
                chatDiv.removeChild(thinkingDiv);
                addMessage(`REXO: ${response.reply}`, 'bot');
                return;
            }
            const data = await response.json();
            if (response.ok && data.candidates && data.candidates[0].content) {
                chatDiv.removeChild(thinkingDiv);
                const reply = data.candidates[0].content.parts[0].text;
                addMessage(`REXO: ${reply}`, 'bot');
                currentKeyIndex = keyIndex;
                return;
            } else if (data.error) {
                lastError = data.error.message;
                continue;
            }
        } catch (error) {
            lastError = error.message;
            continue;
        }
    }
    chatDiv.removeChild(thinkingDiv);
    addMessage(`REXO: كل المفاتيح وقعت يا سيف 😅 آخر خطأ: ${lastError}`, 'error');
}

userInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' &&!e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

loadChat();
</script>
</body>
</html>
